<style>text{font-family:Arial,'Noto Sans SC','PingFang Sans SC','PingFang SC','Microsoft YaHei',sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 4.5s ease-in-out infinite}.drift{animation:drift 9s ease-in-out infinite alternate}.turn{transform-box:fill-box;transform-origin:center;animation:turn 80s linear infinite}.stage{animation:pulse 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{to{transform:translate(6px,-8px)}}@keyframes turn{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1000" height="430" rx="16" fill="#fdf9fe"/>

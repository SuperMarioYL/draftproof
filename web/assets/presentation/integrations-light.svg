<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" data-palette="bd56e6-e76ac8-c6acf6-ec25e87286c3" role="img" aria-labelledby="t d">
<title id="t">DraftProof 能力与边界</title><desc id="d">中心是按字节哈希的 append-only 快照链；环绕编辑器、命令、产物与边界：仅本地、不上云。</desc>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" data-palette="bd56e6-e76ac8-c6acf6-ec25e87286c3" role="img" aria-labelledby="t d">
<title id="t">DraftProof 核心流程</title><desc id="d">init 密钥卡预登记、watch 捕获保存、export 导出回执、verify 离线复核；篡改任何快照即 FAIL 并定位断点。</desc>
<defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="1"><stop stop-color="#a149c5"/><stop offset=".55" stop-color="#ab4f94"/><stop offset="1" stop-color="#796997"/></linearGradient><radialGradient id="halo"><stop stop-color="#a149c5" stop-opacity=".20"/><stop offset="1" stop-color="#fdf9fe" stop-opacity="0"/></radialGradient><filter id="glow" x="-60%%" y="-60%%" width="220%%" height="220%%"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ebcbf7" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#a149c5" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans SC','PingFang Sans SC','PingFang SC','Microsoft YaHei',sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 4.5s ease-in-out infinite}.drift{animation:drift 9s ease-in-out infinite alternate}.turn{transform-box:fill-box;transform-origin:center;animation:turn 80s linear infinite}.stage{animation:pulse 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{to{transform:translate(6px,-8px)}}@keyframes turn{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="1000" height="400" rx="16" fill="#fdf9fe"/>
<rect width="1000" height="400" rx="16" fill="url(#grid)"/>
<rect x="36" y="64" width="190" height="196" rx="12" fill="#fcf7fe" stroke="#ebcbf7" stroke-width="1.4"/>
<circle class="stage" style="animation-delay:0.0s" cx="131" cy="96" r="17" fill="none" stroke="#a149c5" stroke-width="1.6"/>
<text x="131" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#a149c5">01</text>
<text x="131" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#211630">init</text>
<text x="131" y="176" text-anchor="middle" font-size="11.5" fill="#6a5e88">生成 ed25519 密钥</text>
<text x="131" y="200" text-anchor="middle" font-size="11.5" fill="#6a5e88">密钥卡发导师预登记</text>
<text x="131" y="224" text-anchor="middle" font-size="11.5" fill="#6a5e88">事后重造对不上指纹</text>
<path d="M232 162L276 162" fill="none" stroke="#a149c5" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M232 162L276 162" class="flow" fill="none" stroke="#ab4f94" stroke-width="2"/>
<rect x="282" y="64" width="190" height="196" rx="12" fill="#fcf7fe" stroke="#ebcbf7" stroke-width="1.4"/>
<circle class="stage" style="animation-delay:1.5s" cx="377" cy="96" r="17" fill="none" stroke="#a149c5" stroke-width="1.6"/>
<text x="377" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#a149c5">02</text>
<text x="377" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#211630">watch</text>
<text x="377" y="176" text-anchor="middle" font-size="11.5" fill="#6a5e88">常驻监听论文目录</text>
<text x="377" y="200" text-anchor="middle" font-size="11.5" fill="#6a5e88">每次保存追加签名快照</text>
<text x="377" y="224" text-anchor="middle" font-size="11.5" fill="#6a5e88">任何编辑器 · 写作零感知</text>
<path d="M478 162L522 162" fill="none" stroke="#a149c5" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M478 162L522 162" class="flow" fill="none" stroke="#ab4f94" stroke-width="2"/>
<rect x="528" y="64" width="190" height="196" rx="12" fill="#fcf7fe" stroke="#ebcbf7" stroke-width="1.4"/>
<circle class="stage" style="animation-delay:3.0s" cx="623" cy="96" r="17" fill="none" stroke="#a149c5" stroke-width="1.6"/>
<text x="623" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#a149c5">03</text>
<text x="623" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#211630">export</text>
<text x="623" y="176" text-anchor="middle" font-size="11.5" fill="#6a5e88">误判当天一条命令</text>
<text x="623" y="200" text-anchor="middle" font-size="11.5" fill="#6a5e88">receipt-*.dpb 验签包</text>
<text x="623" y="224" text-anchor="middle" font-size="11.5" fill="#6a5e88">可打印 HTML 时间线</text>
<path d="M724 162L768 162" fill="none" stroke="#a149c5" stroke-width="1.4" marker-end="url(#arrow)"/>
<path d="M724 162L768 162" class="flow" fill="none" stroke="#ab4f94" stroke-width="2"/>
<rect x="774" y="64" width="190" height="196" rx="12" fill="#fcf7fe" stroke="#ebcbf7" stroke-width="1.4"/>
<circle class="stage" style="animation-delay:4.5s" cx="869" cy="96" r="17" fill="none" stroke="#a149c5" stroke-width="1.6"/>
<text x="869" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#a149c5">04</text>
<text x="869" y="146" text-anchor="middle" font-size="16" font-weight="700" fill="#211630">verify</text>
<text x="869" y="176" text-anchor="middle" font-size="11.5" fill="#6a5e88">学位办离线复核</text>
<text x="869" y="200" text-anchor="middle" font-size="11.5" fill="#6a5e88">未动 → PASS</text>
<text x="869" y="224" text-anchor="middle" font-size="11.5" fill="#6a5e88">改任一字符 → FAIL</text>
<path d="M869 260 L869 300" fill="none" stroke="#cf222e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text x="712" y="288" text-anchor="middle" font-size="11.5" fill="#6a5e88">篡改任一快照 / 时间戳</text>
<rect x="700" y="306" width="168" height="34" rx="8" fill="#fcf7fe" stroke="#cf222e" stroke-width="1.2"/><text x="784" y="327" text-anchor="middle" font-size="13" fill="#211630">FAIL · 定位断点</text><rect x="360" y="306" width="250" height="34" rx="8" fill="#fcf7fe" stroke="#1a7f37" stroke-width="1.2"/><text x="485" y="327" text-anchor="middle" font-size="13" fill="#211630">同一份回执，未动 → PASS</text><text x="500" y="380" text-anchor="middle" font-size="12.5" fill="#6a5e88">写作在先、存证在先：回执不能事后补录——这正是它与“事后洗稿”的本质区别。</text>
</svg>

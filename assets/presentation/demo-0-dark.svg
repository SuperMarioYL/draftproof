<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" data-palette="bd56e6-e76ac8-c6acf6-ec25e87286c3" role="img" aria-labelledby="t d">
<title id="t">同一份回执的两个结局</title><desc id="d">未动 → PASS；把 seq 2 的 content_hash 改 8 个字符 → 签名与链同时断裂，FAIL 并定位断点。</desc>
<defs><linearGradient id="brand" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="1"><stop stop-color="#bd56e6"/><stop offset=".55" stop-color="#e76ac8"/><stop offset="1" stop-color="#c6acf6"/></linearGradient><radialGradient id="halo"><stop stop-color="#bd56e6" stop-opacity=".20"/><stop offset="1" stop-color="#090712" stop-opacity="0"/></radialGradient><filter id="glow" x="-60%%" y="-60%%" width="220%%" height="220%%"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#311841" stroke-opacity=".35" stroke-width=".6"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#bd56e6" stroke-width="1.5"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans SC','PingFang Sans SC','PingFang SC','Microsoft YaHei',sans-serif}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}.flow{stroke-dasharray:10 110;animation:flow 6s linear infinite}.pulse{animation:pulse 4.5s ease-in-out infinite}.drift{animation:drift 9s ease-in-out infinite alternate}.turn{transform-box:fill-box;transform-origin:center;animation:turn 80s linear infinite}.stage{animation:pulse 6s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-360}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes drift{to{transform:translate(6px,-8px)}}@keyframes turn{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect width="900" height="360" rx="16" fill="#090712"/>
<rect width="900" height="360" rx="16" fill="url(#grid)"/>
<rect x="40" y="60" width="360" height="240" rx="12" fill="#11101f" stroke="#311841" stroke-width="1.4"/>
<circle cx="72" cy="96" r="6" class="pulse" fill="#3fb950"/><text x="88" y="101" font-size="15" font-weight="700" fill="#f4eefd">PASS 整链未被篡改</text>
<text x="72" y="140" font-size="12.5" fill="#aa9cc4" class="mono">4/4 个快照 ed25519 签名有效</text>
<text x="72" y="170" font-size="12.5" fill="#aa9cc4" class="mono">3/3 个链接逐环匹配</text>
<text x="72" y="200" font-size="12.5" fill="#aa9cc4" class="mono">回执签名有效 · 统计一致</text>
<text x="72" y="264" font-size="11.5" fill="#aa9cc4">学位办：与预登记密钥卡指纹比对</text>
<path d="M416 180L484 180" fill="none" stroke="#f85149" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="450" y="150" text-anchor="middle" font-size="11.5" fill="#aa9cc4">改 8 个字符</text>
<text x="450" y="214" text-anchor="middle" font-size="10.5" fill="#aa9cc4">content_hash</text>
<rect x="500" y="60" width="360" height="240" rx="12" fill="#11101f" stroke="#f85149" stroke-width="1.4"/>
<circle cx="532" cy="96" r="6" class="pulse" style="animation-delay:.8s" fill="#f85149"/><text x="548" y="101" font-size="15" font-weight="700" fill="#f4eefd">FAIL 检测到篡改</text>
<text x="532" y="140" font-size="12.5" fill="#aa9cc4" class="mono">快照 #2 ed25519 签名无效</text>
<text x="532" y="170" font-size="12.5" fill="#aa9cc4" class="mono">快照 #3 prev_hash 不匹配</text>
<text x="532" y="200" font-size="12.5" fill="#aa9cc4" class="mono">断点定位到具体快照位置</text>
<text x="532" y="264" font-size="11.5" fill="#aa9cc4">exit 1 · 复核建议见输出</text>
<text x="450" y="336" text-anchor="middle" font-size="12.5" fill="#aa9cc4">同一份 receipt-*.dpb：任何一处改动——哪怕一个时间戳——都逃不过链式验签。</text>
</svg>

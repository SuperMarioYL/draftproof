name: demo

# Manual refresh only — the committed docs/demo-tamper-reject.gif is the source
# of truth; a flaky render must never fail a release.
on: { workflow_dispatch: {} }

permissions:
  contents: write

jobs:
  vhs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build the binary where the tape expects it (bin/draftproof)
        run: go build -o bin/draftproof .
      - name: Install vhs + ttyd + ffmpeg (apt) and CJK fonts
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://repo.charm.sh/apt/gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/charm.gpg
          echo "deb [signed-by=/etc/apt/keyrings/charm.gpg] https://repo.charm.sh/apt/ * *" | sudo tee /etc/apt/sources.list.d/charm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y vhs ttyd ffmpeg fonts-noto-cjk
      - name: Render demo gif
        run: vhs docs/demo.tape
      - name: Commit rendered gif
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add docs/demo-tamper-reject.gif
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "chore: render demo gif"
          git push
